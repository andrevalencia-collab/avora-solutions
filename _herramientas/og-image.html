<!doctype html>
<!-- Plantilla de la imagen para compartir (1200×630), con la identidad v2 de la landing.
     Se captura con el navegador en modo headless y se guarda como img/og-image.jpg. -->
<html lang="es-PA">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Space+Grotesk:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b0b0c;
    color: #f2f2f0;
    font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, .palabra, .marca b { font-family: "Space Grotesk", "Helvetica Neue", system-ui, sans-serif; }
  /* El mismo panel de la landing: esquinas de 28px, borde fino y la barrita azul */
  .panel {
    position: absolute;
    inset: 16px;
    border: 1px solid rgba(242, 242, 240, .20);
    border-radius: 28px;
    background: #111113;
    overflow: hidden;
  }
  .barrita {
    position: absolute;
    top: 30px;
    left: 30px;
    width: 16px;
    height: 2px;
    background: #4d5bff;
    transform: rotate(-26.6deg);
  }
  .marca { position: absolute; top: 56px; left: 64px; display: flex; align-items: center; gap: 14px; }
  .marca svg { width: 47px; height: 40px; }
  .marca b { font-size: 26px; font-weight: 700; letter-spacing: .02em; }
  .lugar { position: absolute; top: 64px; right: 64px; font-size: 20px; color: #8e8e93; }
  /* CRECER en contorno, detrás del título (igual que en la portada) */
  .palabra {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 300px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.04em;
    white-space: nowrap;
    color: #111113;
    -webkit-text-stroke: 2px rgba(242, 242, 240, .14);
    paint-order: stroke fill;
  }
  h1 {
    position: absolute;
    left: 64px;
    top: 150px;
    margin: 0;
    font-size: 112px;
    font-weight: 600;
    line-height: .9;
    letter-spacing: -.055em;
  }
  h1 span { display: block; }
  p { position: absolute; left: 64px; right: 64px; bottom: 52px; margin: 0; font-size: 26px; color: #8e8e93; }
</style>
</head>
<body>
  <div class="panel">
    <span class="barrita"></span>
    <div class="palabra">CRECER</div>
    <div class="marca">
      <svg viewBox="14 24 180 154">
        <path fill="#f2f2f0" fill-rule="evenodd" d="M112.0 28.0 L88.0 28.0 L40.6 131.3 L81.2 111.1 L100.0 70.0 L111.8 95.7 L137.2 83.0 Z M18.4 173.8 L50.4 173.8 L65.1 141.8 L127.7 141.8 L142.4 173.8 L174.4 173.8 L136.1 90.3 L110.7 103.0 L118.4 119.8 L77.1 119.8 L33.1 141.8 Z"/>
        <path fill="#4d5bff" d="M147.3 85.5 L144.0 78.8 L188.6 60.7 Z"/>
      </svg>
      <b>AVORA</b>
    </div>
    <div class="lugar">Agencia digital · Panamá</div>
    <h1><span>Creamos sistemas</span><span>que atienden</span><span>por ti.</span></h1>
    <p>Páginas web, automatizaciones y redes sociales.</p>
  </div>
</body>
</html>
