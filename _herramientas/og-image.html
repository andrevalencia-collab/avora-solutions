<!doctype html>
<!-- Plantilla de la imagen para compartir (1200×630). Se captura con el navegador en modo headless. -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #00034A;
    color: #f2f3f7;
    font-family: "Archivo", sans-serif;
  }
  .band {
    position: absolute;
    right: -120px; bottom: -40px;
    width: 760px; height: 380px;
    background: #030756;
    clip-path: polygon(0 100%, 100% 0, 100% 100%);
  }
  .line {
    position: absolute;
    right: 40px; bottom: 130px;
    width: 700px; height: 350px;
  }
  .brand { position: absolute; top: 70px; left: 80px; display: flex; align-items: center; gap: 18px; }
  .brand img { width: 64px; }
  .brand b { display: block; font-size: 34px; font-weight: 800; font-stretch: 125%; line-height: 1; }
  .brand small { display: block; margin-top: 8px; font-size: 13px; font-weight: 600; letter-spacing: .38em; opacity: .8; }
  h1 {
    position: absolute; left: 80px; top: 200px; margin: 0;
    font-size: 84px; font-weight: 800; font-stretch: 125%; line-height: .98; letter-spacing: -.015em;
  }
  h1 span { display: block; }
  h1 span:last-child { color: #4D5BFF; }
  p { position: absolute; left: 80px; bottom: 60px; margin: 0; font-size: 26px; color: #808080; }
</style>
</head>
<body>
  <div class="band"></div>
  <svg class="line" viewBox="0 0 200 100">
    <path d="M0 100 L176 12" stroke="#4D5BFF" stroke-width="1" fill="none" opacity=".6"/>
    <path d="M181 13 L179 8 L200 0 Z" fill="#4D5BFF"/>
  </svg>
  <div class="brand">
    <img src="../img/logo-avora-claro.svg" alt="">
    <div><b>AVORA</b><small>SOLUTIONS</small></div>
  </div>
  <h1><span>Atrae.</span><span>Convierte.</span><span>Automatiza.</span></h1>
  <p>Más clientes y menos trabajo manual · Panamá</p>
</body>
</html>
